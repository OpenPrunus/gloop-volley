services:
  gloop:                         # site web (PHP 8.5 + Apache)
    build: .
    ports:
      - "8090:80"
    environment:
      # URL WebSocket vue par le navigateur ; vide = même hôte, port 8081 (ou /ws derrière HTTPS)
      GLOOP_WS: "ws://localhost:8091"
    volumes:
      - data:/var/www/html/data
    restart: unless-stopped

  gloop-ws:                      # serveur de jeu multijoueur (même image, autre commande)
    build: .
    command: ["php", "/opt/gloop/server.php"]
    ports:
      - "8091:8081"
    volumes:
      - data:/var/www/html/data   # classement (écrit ici, lu par le site)
    environment:
      WS_PORT: "8081"
      WS_ALLOWED_ORIGINS: ""     # ex. "https://gloop.exemple.fr" pour restreindre
      TRUSTED_PROXIES: ""        # reverse proxies dont on croit X-Real-IP (vide = réseaux privés)
      GLOOP_MAX_CONN_PER_IP: "10"      # connexions simultanées par adresse
      GLOOP_MAX_ACCOUNTS_PER_IP: "3"   # comptes classés par adresse sur la fenêtre
      GLOOP_MAX_PAIR_MATCHES: "4"      # parties classées entre les deux mêmes joueurs
      GLOOP_ALLOW_SAME_IP: "0"         # 1 = autoriser le classement entre joueurs de la même adresse
    restart: unless-stopped

volumes:
  data:
